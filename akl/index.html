<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام الأكل الشهري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: phone-width column. Day dashboard first (calories ring + macro bars), then the plan's five meals,
   a logging tab that turns speech or typed ingredients into exact macros, saved recipes, and progress.
   Macro colours stay fixed everywhere: protein blue, carbs saffron, fat rose. */
:root{
  --bg:#f2f4ef; --card:#ffffff; --ink:#1d2a23; --mute:#5f6e66; --line:#dde3da;
  --acc:#2f6b4f; --acc-soft:#e1ede5; --kc:#c98a12;
  --p:#336b9e; --c:#c98a12; --f:#b0506a; --p-soft:#e2ebf4; --c-soft:#f6ecd5; --f-soft:#f5e2e7;
  --warn:#b4471f; --on-acc:#ffffff;
  --display:"El Messiri","Tajawal",Tahoma,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a16; --card:#1b2620; --ink:#e7efe9; --mute:#9aaba1; --line:#2c3a32;
  --acc:#6cc39a; --acc-soft:#1f3a2d; --kc:#e7b24a;
  --p:#7fb0e0; --c:#e7b24a; --f:#e58aa3; --p-soft:#1d2d3d; --c-soft:#3a3018; --f-soft:#3d2129;
  --warn:#f08a5d; --on-acc:#0f1a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a16; --card:#1b2620; --ink:#e7efe9; --mute:#9aaba1; --line:#2c3a32;
  --acc:#6cc39a; --acc-soft:#1f3a2d; --kc:#e7b24a;
  --p:#7fb0e0; --c:#e7b24a; --f:#e58aa3; --p-soft:#1d2d3d; --c-soft:#3a3018; --f-soft:#3d2129;
  --warn:#f08a5d; --on-acc:#0f1a14; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
main{max-width:600px;margin:0 auto;padding:14px 16px 170px;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-size:28px;margin:0;line-height:1.3;text-wrap:balance}
h2{font-family:var(--display);font-size:20px;margin:4px 0 0;line-height:1.4;text-wrap:balance}
h3{font-size:16px;margin:0}
.mute{color:var(--mute)} .small{font-size:13.5px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mute)} .chip.ok i{background:var(--acc)} .chip.bad i{background:var(--warn)}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:7;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(20,40,30,.06)}
.tabs button{border:0;background:none;color:var(--mute);font-weight:700;font-size:12.5px;border-radius:12px;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--acc);background:var(--acc-soft)}
@media (min-width:640px){.tabs{left:50%;right:auto;transform:translateX(-50%);width:600px;bottom:12px;border:1px solid var(--line);border-radius:20px;padding:6px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.ghost{border-color:transparent;background:none;color:var(--mute);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);min-height:44px}
textarea.in{min-height:96px;resize:vertical;line-height:1.7}
label.f{display:grid;gap:3px;font-size:13.5px;color:var(--mute)}

/* dashboard */
.dash{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:132px;height:132px}
.ring .tr{stroke:var(--c-soft)} .ring .fg{stroke:var(--kc);transition:stroke-dashoffset .35s}
.ring.over .fg{stroke:var(--warn)}
.ring .big{fill:var(--ink);font:800 26px var(--body)} .ring .lab{fill:var(--mute);font:500 12px var(--body)}
.mac{display:grid;gap:9px}
.mb{display:grid;gap:3px}
.mb .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.mb .h b{font-weight:700}
.bar{height:9px;border-radius:6px;background:var(--x-soft);overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--x);border-radius:6px;transition:width .3s}
.mP{--x:var(--p);--x-soft:var(--p-soft)} .mC{--x:var(--c);--x-soft:var(--c-soft)} .mF{--x:var(--f);--x-soft:var(--f-soft)}
.mP b{color:var(--p)} .mC b{color:var(--c)} .mF b{color:var(--f)}
.left{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14.5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.d{flex:0 0 auto;width:44px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;display:grid;place-items:center;line-height:1.1;padding:0}
.d small{display:block;font-size:10px;font-weight:500;color:var(--mute)}
.d.has{background:var(--acc-soft)} .d.full{border-color:var(--acc)}
.d.now{box-shadow:inset 0 -3px 0 var(--kc)}
.d.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)} .d.sel small{color:var(--bg)}

/* meals */
.meal{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;border-inline-start:5px solid var(--line);transition:border-color .2s,background .2s}
.meal.done{border-inline-start-color:var(--acc);background:linear-gradient(var(--acc-soft),var(--acc-soft)) top/100% 0 no-repeat,var(--card)}
.mh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ck{width:30px;height:30px;border-radius:9px;border:2px solid var(--acc);background:none;flex:0 0 auto;display:grid;place-items:center;color:var(--on-acc);font-size:17px;padding:0}
.ck.on{background:var(--acc);animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.em{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;flex:0 0 auto}
.mt{flex:1;min-width:0}
.mt .lb{font-size:12.5px;color:var(--mute)}
.mt .tt{font-weight:700;overflow-wrap:anywhere;line-height:1.4}
.meal.done .tt{color:var(--mute)}
.kc{font-weight:800;white-space:nowrap;font-size:15px}
.kc small{font-weight:500;color:var(--mute);font-size:12px}
.mm{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.pill{font-size:12.5px;border-radius:999px;padding:1px 9px;background:var(--x-soft);color:var(--ink);white-space:nowrap}
.pill b{color:var(--x)}
.tag{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.sw{background:var(--c-soft);border-color:transparent;color:var(--ink)}
details.rcp{border-top:1px dashed var(--line)}
details.rcp summary{list-style:none;cursor:pointer;padding:8px 12px;color:var(--acc);font-weight:700;font-size:14.5px;min-height:40px;display:flex;align-items:center}
details.rcp summary::-webkit-details-marker{display:none}
details.rcp summary::before{content:"+";margin-inline-end:8px;font-size:18px}
details.rcp[open] summary::before{content:"−"}
.rb{padding:0 14px 12px;font-size:15px}
.rb ol{margin:6px 0;padding-inline-start:22px} .rb li{margin-bottom:4px}
.pt{background:var(--acc-soft);border-radius:12px;padding:8px 12px;margin:4px 0 8px;font-size:14.5px}
.nb{background:var(--c-soft);border-radius:12px;padding:6px 12px;margin-top:8px}.nb p{margin:4px 0;font-size:14px}
.ma{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.ma .btn{min-height:38px;padding:5px 12px;font-size:14px}

.ent{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0}
.ent .mt .tt{font-weight:600}
.water{display:flex;gap:4px;flex-wrap:wrap}
.water button{border:0;background:none;font-size:24px;opacity:.25;padding:2px;min-width:36px;min-height:40px}
.water button.on{opacity:1}

/* logger */
.voice{display:grid;gap:10px}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;min-height:58px;font-weight:800;font-size:17px;background:var(--acc);color:var(--on-acc)}
.mic.live{background:var(--warn)}
.mic svg{width:22px;height:22px}
.partial{color:var(--mute);font-style:italic;min-height:1.6em;font-size:14.5px}
.status{font-size:14px;color:var(--mute)} .status.err{color:var(--warn)}
.ir{display:grid;grid-template-columns:1fr 74px 104px 34px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ir:first-child{border-top:0}
.ir .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.ir .nm small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.ir .in{min-height:40px;padding:6px 8px}
.x{border:0;background:none;color:var(--mute);font-size:20px;min-height:40px;padding:0}
.est{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--c-soft);border-radius:10px;padding:8px}
.est label{font-size:11.5px}
.est .in{min-height:36px;padding:4px 6px;background:var(--card)}
.tot{display:grid;gap:10px}
.tot .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tot .big b{font-size:34px;font-weight:800;color:var(--kc);line-height:1}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{border-radius:12px;padding:8px;background:var(--x-soft);text-align:center}
.trio b{display:block;font-size:20px;color:var(--x);line-height:1.3}
.trio span{font-size:12.5px;color:var(--mute)}
.portion{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:13px;color:var(--mute)}

/* charts */
svg.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)} .chart .goal{stroke:var(--warn);stroke-dasharray:4 4}
.chart .b{fill:var(--acc)} .chart .b.over{fill:var(--warn)} .chart .b.no{fill:var(--line)}
.chart text{fill:var(--mute);font:12px var(--body)}
.chart .ln{fill:none;stroke:var(--p);stroke-width:2.5} .chart .pt2{fill:var(--p)} .chart .ar{fill:var(--p-soft)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat div{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px}

.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);z-index:8;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800;padding:12px 20px;min-height:52px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
[dir="rtl"] .fab{transform:translateX(50%)}
.fab svg{width:20px;height:20px}
.fab[hidden],body.ro .fab,.toast[hidden]{display:none!important}
body.ro .ma,body.ro .x,body.ro [data-act="addx"],body.ro [data-tab="log"],body.ro [data-act="userec"],body.ro .wform,body.ro .cfgform{display:none!important}
body.ro .tabs{grid-template-columns:repeat(4,1fr)}
body.ro .rwin{pointer-events:none;background:none;border-color:transparent;padding-inline:0}
body.ro .ck,body.ro .water button{pointer-events:none}
.hero{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px 18px 16px;display:grid;gap:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--acc);opacity:.35}
.hero h1{color:var(--bg);font-size:26px;position:relative}
.hero .q{font-size:15px;opacity:.85;position:relative;line-height:1.6}
.hero .stats{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.hero .st{background:rgba(255,255,255,.12);border-radius:12px;padding:6px 12px;font-size:13.5px;display:flex;gap:6px;align-items:baseline}
.hero .st b{font-size:18px;font-weight:800}
.hero .chip{background:rgba(255,255,255,.12);border-color:transparent;color:var(--bg)}
.hero .chip.ok i{background:var(--acc)}
.cheer{display:flex;gap:10px;align-items:center;background:var(--c-soft);border-radius:16px;padding:10px 14px;font-weight:600}
.cheer span{font-size:26px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bd{border:1.5px dashed var(--line);border-radius:16px;padding:12px;display:grid;gap:2px;justify-items:center;text-align:center;background:var(--card)}
.bd .e{font-size:32px;line-height:1.2;filter:grayscale(1);opacity:.35}
.bd b{font-size:14.5px}
.bd small{font-size:12.5px;color:var(--mute);line-height:1.4}
.bd.on{border-style:solid;border-color:var(--kc);background:var(--c-soft)}
.bd.on .e{filter:none;opacity:1}
.lvl{display:grid;gap:8px}
.lvl .top b{font-size:34px;font-weight:800;color:var(--kc);line-height:1}
.ms{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.ms .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--bg)}
.ms.ok .ic{background:var(--kc)}
.ms .rwin{margin-top:4px;min-height:40px;padding:6px 10px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.note{display:flex;gap:10px;align-items:center;background:var(--p-soft);border-color:transparent}
.note>span{font-size:26px}.note>div{flex:1}
.wrem{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.wrem .btn{min-height:38px;font-size:14px;text-decoration:none;color:var(--ink)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 16px;font-weight:700;z-index:9;max-width:90vw}
@media (max-width:400px){.dash{grid-template-columns:1fr;justify-items:center}.mac{width:100%}.ir{grid-template-columns:1fr 64px 92px 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app">
  <header class="hero">
    <div class="top" style="position:relative"><h1 id="ttl">نظام الأكل الشهري</h1><span class="chip" id="sync"><i></i><span>جاري التحميل…</span></span></div>
    <div class="q" id="sub"></div>
    <div class="stats" id="hstats"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="الأقسام">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>اليوم</button>
    <button type="button" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>سجّلي</button>
    <button type="button" data-tab="rw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H8a2.5 2.5 0 1 1 0-5c3 0 4 5 4 5zM12 7h4a2.5 2.5 0 1 0 0-5c-3 0-4 5-4 5z"/></svg>مكافآت</button>
    <button type="button" data-tab="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>وصفات</button>
    <button type="button" data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>التقدم</button>
  </nav>
  <div id="view" style="display:flex;flex-direction:column;gap:14px"></div>
</main>
<button type="button" class="fab" id="fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>سجّلي بصوتك</span></button>
<div class="toast" id="toast" hidden role="status"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var F=["موزة صغيرة","تفاحة صغيرة","برتقانة"];
var B=[["🍳", "أومليت وفول وجبنة", "أومليت بيضة (مخفوقة ومسوّية في تيفال بمعلقة صغيرة زيت) + ربع كوباية فول بالكمون + جبنة بيضا ٤٠ جم + زبادي ٣ م ك + رغيف بلدي صغير + خيار وطماطم + ٣ زيتونات", "اخفقي البيضة بفلفل وجزر مبشور ورشة كمون وسوّيها في تيفال بمعلقة صغيرة زيت.|سخّني الفول بكمون وليمون.|رصّي الأومليت والفول والجبنة والزبادي والخضار والزيتون في طبق مع العيش.", "أومليت صغير من غير ملح مقطّع حتت وعيش طري.", "قطّعي الخضار بالليل."],
["🫘", "فول بالطحينة وبيضة مسلوقة", "نص كوباية فول بالطحينة والليمون + بيضة مسلوقة + زبادي ٦ م ك + نص رغيف بلدي + طماطم وخيار + ٣ زيتونات", "سخّني الفول واخلطيه بنص معلقة طحينة وليمون وكمون.|اسلقي البيضة ٩ دقايق.|قدّميهم مع الزبادي والخضار والزيتون والعيش.", "فول مهروس من غير ملح وبيضة مسلوقة مهروسة.", "الفول المعلّب أسرع حل."],

kofta:["🍢","كفتة فرن","كفتة ١٢٠ جم + ثلثين كوباية أرز + بطاطس ٢٠٠ جم + سلطة","للأسرة: ٨٠٠ جم لحمة مفرومة + بصلة مبشورة + حزمة بقدونس مفروم + م ص كمون + م ص كزبرة + نص م ص سبع بهارات + رشة قرفة + ملح وفلفل.|اعجنيها وشكّليها أصابع.|على رف الفرن وتحته صينية، ٢٢٠° ٢٠ دقيقة.|جنبها صينية طماطم وبصل وفلفل شرايح ١٥ دقيقة، وأرز أبيض بمعلقة زيت.",["الكفتة والخضار في الفرن في وقت واحد.","يقلي كفتته في طاسة لو عاوز.","اشويها له من غير ملح."],"شكّليها بالليل."],

function inGoal(n){if(!fullDay(n))return false;var k=eaten(n)[0],g=+S.cfg.g||1800;return k>=g-250&&k<=g+100}
function dayPts(n){var d=S.days[n];if(!d)return 0;var p=0;for(var k=0;k<5;k++)if(d.ck[k]||d.sw[k])p+=10;if(fullDay(n))p+=30;if(d.w>=10)p+=10;else if(d.w>=6)p+=5;if(inGoal(n))p+=20;return p}
function totalPts(){var t=0;for(var n=1;n<=30;n++)t+=dayPts(n);return t+Math.min(S.wt.length,8)*5}
function streakNow(){var t=todayN(),i=fullDay(t)?t:t-1,c=0;while(i>=1&&fullDay(i)){c++;i--}return c}
function bestStreak(){var m=0,c=0;for(var n=1;n<=30;n++){if(fullDay(n)){c++;if(c>m)m=c}else c=0}return m}
function kgLost(){if(S.wt.length<2)return 0;var w=S.wt.slice().sort(function(a,b){return a.d<b.d?-1:1});return Math.max(0,w[0].kg-w[w.length-1].kg)}
function stats(){var st={meals:0,full:0,water:0,goal:0,logs:0};for(var n=1;n<=30;n++){var d=S.days[n];if(!d)continue;for(var k=0;k<5;k++)if(d.ck[k]||d.sw[k])st.meals++;st.logs+=Object.keys(d.sw).length+d.ex.length;if(fullDay(n))st.full++;if(d.w>=10)st.water++;if(inGoal(n))st.goal++}st.best=bestStreak();st.recs=S.rec.length;st.lost=kgLost();return st}

function confetti(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;var cv=document.getElementById("fx"),cx=cv.getContext("2d");if(!cx)return;var W=cv.width=innerWidth,H=cv.height=innerHeight,cs=getComputedStyle(document.documentElement),col=["--p","--c","--f","--acc","--kc"].map(function(v){return cs.getPropertyValue(v).trim()||"#2f6b4f"}),ps=[];
  for(var i=0;i<110;i++)ps.push({x:W/2+(Math.random()-.5)*60,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,r:4+Math.random()*5,c:col[i%5],a:Math.random()*6,va:(Math.random()-.5)*.3});
  var t0=performance.now();(function step(t){var dt=t-t0;cx.clearRect(0,0,W,H);ps.forEach(function(p){p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,1-dt/1900);cx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);cx.restore()});if(dt<1900)requestAnimationFrame(step);else cx.clearRect(0,0,W,H)})(t0)}

var NUMW={"واحد":1,"واحده":1,"وحده":1,"اتنين":2,"اثنين":2,"تلاته":3,"ثلاثه":3,"اربعه":4,"اربع":4,"خمسه":5,"خمس":5,"سته":6,"ست":6,"سبعه":7,"تمانيه":8,"تسعه":9,"عشره":10,"نص":0.5,"نصف":0.5,"ربع":0.25,"تلت":0.33,"ثلث":0.33};
var UNW=[["كيلو","كيلو"],["كجم","كيلو"],["جرام","جم"],["جم","جم"],["غرام","جم"],["معلقه كبيره","معلقة كبيرة"],["معالق كبيره","معلقة كبيرة"],["معلقه صغيره","معلقة صغيرة"],["معالق صغيره","معلقة صغيرة"],["معلقتين","معلقة كبيرة",2],["معلقه","معلقة كبيرة"],["كوبايتين","كوباية",2],["كوبايه","كوباية"],["كوب","كوباية"],["رغيفين","رغيف",2],["رغيف","رغيف"],["شريحتين","شريحة",2],["شرايح","شريحة"],["شريحه","شريحة"],["علبه","علبة"],["حبايه","حباية"],["بيضتين","بيضة",2],["بيضات","بيضة"],["بيضه","بيضة"]];
function localParse(text){
  var t=nz(toLat(text)),segs=t.split(/[،,\n؛;.]+|\sو\s|\sو(?=\S)/),rows=[],serv=1,ate=1;
  segs.forEach(function(sg){sg=" "+sg.trim()+" ";if(sg.trim().length<2)return;
    var hit=null;for(var i=0;i<ALIAS.length;i++){var a=ALIAS[i][0];if(a&&sg.indexOf(a)>-1){hit=ALIAS[i][1];break}}
    if(!hit)return;var q=null,mm=sg.match(/(\d+(?:\.\d+)?)/);if(mm)q=parseFloat(mm[1]);
    var unit=null,mult=1;for(var j=0;j<UNW.length;j++){if(sg.indexOf(UNW[j][0])>-1){unit=UNW[j][1];if(UNW[j][2])mult=UNW[j][2];break}}
    if(q==null){for(var w in NUMW)if(new RegExp("(^|\\s)"+w+"(\\s|$)").test(sg)){q=NUMW[w];break}}
    if(q==null)q=1;q=q*(q==1&&mult>1?mult:1);
    var us=unitsFor(hit);if(unit&&!us[unit]){if(unit=="بيضة"&&hit=="egg")unit="بيضة";else unit=null}
    if(/نص كيلو/.test(sg)){unit="كيلو";q=0.5}
    if(!unit)unit=(mm&&q>=20)?"جم":defUnit(hit);
    rows.push({k:hit,n:FD[hit].n,q:q,u:unit})});
  var s1=t.match(/(\d+(?:\.\d+)?)\s*(اطباق|طبق|حصص|حصه|افراد)/);if(s1)serv=parseFloat(s1[1]);
  return {rows:rows,serv:serv,ate:ate}
}
function promptFor(text){

  return "You turn an Egyptian Arabic description of food someone ate or cooked into structured ingredients so a page can compute exact macros.\n\nFood database (key|Arabic name|household unit weights in grams):\n"+lines+
  "\n\nGeneral measures if not listed: معلقة كبيرة 15 g, معلقة صغيرة 5 g, كوباية 200 g, نص كيلو 500 g, ربع كيلو 250 g.\n\nDescription:\n\"\"\""+text.slice(0,3000)+"\"\"\"\n\n"+
  "Reply with ONLY a JSON object like {\"name\":\"مكرونة بالفراخ\",\"servings\":4,\"eaten\":1,\"items\":[{\"key\":\"pasta\",\"label\":\"مكرونة\",\"grams\":500},{\"key\":null,\"label\":\"صوص جبنة جاهز\",\"grams\":60,\"per100\":[220,5,8,19]}]}.\n"+
  "Rules: one item per ingredient with the TOTAL grams used. Use raw-weight keys unless she says the amount was cooked (مطبوخ، مسلوق، مشوي) and a cooked key exists. "+
  "servings = how many equal portions the whole dish made (1 if she only describes her own plate); eaten = how many of those portions she ate (fractions allowed: نص طبق = 0.5). "+

}
function itemToRow(it){
  var k=it&&FD[it.key]?it.key:null,g=Math.max(0,+it.grams||0);
  if(k){var f=FD[k],best=null,CNT=/^(بيضة|بياض بيضة|رغيف|نص رغيف|شريحة|حباية|موزة|تفاحة|صدر|ورك|قرص|علبة|فص|مثلث|صباع|فيليه|قطعة|حفنة|كيس صغير|شقة)$/,SP=/^(oil|ghee|butter|tahini|honey|sugar|jam|paste|mayo|ketchup)$/;for(var u in f.u){if(!CNT.test(u)&&!(SP.test(k)&&/معلقة/.test(u)))continue;var q=g/f.u[u];if(q>=0.5&&q<=30&&Math.abs(q*2-Math.round(q*2))<0.08){best=[Math.round(q*2)/2,u];break}}
    return best?{k:k,n:f.n,q:best[0],u:best[1]}:{k:k,n:f.n,q:Math.round(g),u:"جم"}}
  var p=Array.isArray(it.per100)?it.per100.slice(0,4).map(function(v){return Math.max(0,+v||0)}):[0,0,0,0];while(p.length<4)p.push(0);
  return {k:null,n:String(it.label||"مكوّن").slice(0,60),q:Math.round(g),u:"جم",per:p}
}

  var text=(LG.text||"").trim();if(!text){LG.status="قوليلي أو اكتبيلي أكلتي إيه الأول.";LG.err=true;render();return}
  LG.err=false;
  if(SAMPLE){
    var ctl=new AbortController();busyAI=ctl;LG.status="بحسب المكونات…";render();
    try{
      var o=await SAMPLE.json(promptFor(text),{modelTier:"quick",signal:ctl.signal});
      var items=o&&Array.isArray(o.items)?o.items:[];
      if(!items.length)throw {code:"empty"};
      LG.rows=items.slice(0,40).map(itemToRow).filter(function(r){return r.q>0});
      if(+o.servings>0)LG.serv=Math.round(+o.servings*100)/100;if(+o.eaten>0)LG.ate=Math.round(+o.eaten*100)/100;
      if(!LG.name&&o.name)LG.name=String(o.name).slice(0,80);
      var est=LG.rows.filter(function(r){return !r.k}).length;
      LG.status="لقيت "+ar(LG.rows.length)+" مكوّن"+(est?"، منهم "+ar(est)+" بقيم تقديرية تقدري تعدّليها":"")+". راجعي الكميات وسجّلي.";LG.err=false;
    }catch(e){
      if(e&&e.code=="cancelled"){LG.status="";busyAI=null;render();return}
      if(e&&(e.code=="not_granted"||e.code=="sampling_disabled"||e.code=="capability_disabled"||e.code=="capability_removed"))SAMPLE=null;
      var lp=localParse(text);
      if(lp.rows.length){LG.rows=lp.rows;LG.serv=lp.serv;LG.status="حسبتها بطريقة أبسط، راجعي الكميات كويس.";LG.err=false}
      else{LG.status=e&&e.code=="rate_limited"?"استني دقيقة وجربي تاني.":"مافهمتش المكونات. جربي تقوليها كده: ٢ بيضة، رغيف بلدي، معلقة زيت.";LG.err=true}
    }
    busyAI=null;render();return;
  }
  var r=localParse(text);
  if(r.rows.length){LG.rows=r.rows;LG.serv=r.serv;LG.status="لقيت "+ar(r.rows.length)+" مكوّن. راجعي الكميات.";LG.err=false}
  else{LG.status="مافهمتش المكونات. جربي كده: ٢ بيضة، رغيف بلدي، معلقة زيت.";LG.err=true}
  render();
}

/* ---- Gemini adapter (photo + smarter parsing) ---- */
function setupGem(){if(!window.GEM_JSON||SAMPLE)return;SAMPLE={json:function(p,o){var img=o&&o.image,sig=o&&o.signal;
  var run=window.GEM_JSON(p,img).catch(function(e){var m=String(e&&e.message||e);throw {code:/429|quota|RESOURCE_EXHAUSTED/i.test(m)?"rate_limited":"upstream_error"}});
  if(!sig)return run;return Promise.race([run,new Promise(function(_,rej){sig.addEventListener("abort",function(){rej({code:"cancelled"})})})])}};if(tab=="log")render()}
window.addEventListener("gem-ready",setupGem);
function dbLines(){return FKEYS.map(function(k){var f=FD[k],u=[];for(var x in f.u)u.push(x+"="+f.u[x]);return k+"|"+f.n+(u.length?"|"+u.join(","):"")}).join("\n")}
function photoPrompt(){return "You look at a photo of food someone in Egypt is about to eat, so a page can compute exact macros.\n\nFood database (key|Arabic name|household unit weights in grams):\n"+dbLines()+
  "\n\nIdentify every food visible on the plate or in the bowl, and estimate the grams of each that ONE person is eating here. Include likely cooking oil or ghee as its own item when the food is fried or cooked in fat (estimate conservatively). "+
  "Reply with ONLY a JSON object like {\"name\":\"فطار فول وبيض\",\"servings\":1,\"eaten\":1,\"items\":[{\"key\":\"fool\",\"label\":\"فول\",\"grams\":150},{\"key\":null,\"label\":\"صوص طحينة\",\"grams\":30,\"per100\":[300,8,10,26]}]}. "+
  "Use cooked keys for cooked foods (ricec, pastac, chickc) when they exist. key must be a database key or null; when null give realistic per100 = [kcal, protein g, carbs g, fat g]. name = short Arabic meal name. If the photo shows no food, reply {\"items\":[]}.";}
function applyAI(o,src){var items=o&&Array.isArray(o.items)?o.items:[];if(!items.length)return false;
  LG.rows=items.slice(0,40).map(itemToRow).filter(function(r){return r.q>0});if(!LG.rows.length)return false;
  LG.serv=+o.servings>0?Math.round(+o.servings*100)/100:1;LG.ate=+o.eaten>0?Math.round(+o.eaten*100)/100:1;
  if(!LG.name&&o.name)LG.name=String(o.name).slice(0,80);
  var est=LG.rows.filter(function(r){return !r.k}).length;
  LG.status=(src=="photo"?"دي تقديرات من الصورة: ":"لقيت ")+ar(LG.rows.length)+" مكوّن"+(est?"، منهم "+ar(est)+" بقيم تقديرية":"")+". راجعي الكميات وعدّلي لو محتاجة، وبعدين سجّلي.";LG.err=false;return true}
function shrink(file){return new Promise(function(res,rej){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){var m=1024,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,m/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);var d=c.toDataURL("image/jpeg",0.82);res({data:d.split(",")[1],mime:"image/jpeg",url:d})};img.onerror=function(){URL.revokeObjectURL(url);rej()};img.src=url})}
var PHOTO=null;
async function analyzePhoto(file){
  if(!SAMPLE){LG.status="تصوير الأكل مش متاح دلوقتي، اكتبي أو قولي المكونات.";LG.err=true;render();return}
  var ctl=new AbortController();busyAI=ctl;LG.status="بشوف الصورة وبحسب…";LG.err=false;
  try{var im=await shrink(file);PHOTO=im.url;render();
    var o=await SAMPLE.json(photoPrompt(),{image:im,signal:ctl.signal});
    if(!applyAI(o,"photo")){LG.status="مالقيتش أكل واضح في الصورة. جربي صورة أقرب وفيها نور.";LG.err=true}}
  catch(e){if(e&&e.code=="cancelled"){LG.status=""}else{LG.status=e&&e.code=="rate_limited"?"استني دقيقة وجربي تاني.":"الصورة ماتحسبتش، جربي تاني أو اكتبي المكونات.";LG.err=true}}
  busyAI=null;render()}

/* ================= voice (Chrome speech recognition) ================= */
function makeDict(){
  var C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C)return null;
  var rec=null,st="idle",hP=null,hF=null,hS=null,want=false,lastErr=null,byUser=false;
  function set(x,reason){st=x;if(hS)hS({state:x,reason:reason})}
  function make(){var r=new C();r.lang="ar-EG";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    r.onstart=function(){if(st!="listening")set("listening")};
    r.onresult=function(ev){var interim="";for(var i=ev.resultIndex;i<ev.results.length;i++){var t=ev.results[i][0].transcript;if(ev.results[i].isFinal){if(hF&&t.trim())hF({text:" "+t.trim()})}else interim+=t}if(hP)hP({text:interim})};
    r.onerror=function(e){lastErr=e.error};
    r.onend=function(){
      if(want&&!lastErr){try{rec=make();rec.start();return}catch(e){}}
      rec=null;want=false;var reason=byUser?"stopped":"viewer_stopped";
      if(lastErr=="not-allowed"||lastErr=="service-not-allowed")reason="not_granted";else if(lastErr=="network")reason="network";else if(lastErr&&lastErr!="no-speech"&&lastErr!="aborted")reason="upstream_error";
      if(hP)hP({text:""});set("idle",reason)};
    return r}
  return {
    start:function(){lastErr=null;want=true;byUser=false;set("starting");try{rec=make();rec.start()}catch(e){want=false;set("idle","upstream_error")}return Promise.resolve()},
    stop:function(){want=false;byUser=true;if(rec){set("finishing");try{rec.stop()}catch(e){}}else set("idle","stopped");return Promise.resolve()},
    active:function(){return st!="idle"},
    onPartial:function(h){hP=h},onFinal:function(h){hF=h},onState:function(h){hS=h}}
}
DICT=makeDict();
if(DICT){
  DICT.onPartial(function(e){partial=e.text||"";var p=document.getElementById("partial");if(p)p.textContent=partial});
  DICT.onFinal(function(e){var piece=e.text||"";LG.text=LG.text?LG.text+piece:piece.replace(/^\s+/,"");var ta=document.getElementById("lt");if(ta)ta.value=LG.text;partial="";var p=document.getElementById("partial");if(p)p.textContent=""});

      else if(!LG.text.trim()&&tab=="log"){LG.status="ماسمعتش حاجة، جربي تاني وقربي الموبايل.";LG.err=true}
      if(tab=="log"){render();return}}
    if(tab=="log"){var m=document.getElementById("mic");if(m){m.className="mic"+(micState!="idle"?" live":"");m.lastChild.textContent=micState=="idle"?"اتكلمي وقولي أكلتي إيه":micState=="starting"?"بفتح الميكروفون…":micState=="finishing"?"بكمّل آخر كلام…":"خلصت؟ دوسي هنا"}else render()}else render()});
}
